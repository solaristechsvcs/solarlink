<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarLink · Staff</title>
<style>body{font:16px system-ui;color:#f6f3ff;background:radial-gradient(ellipse at top,#342063,#070615);margin:0;min-height:100vh}main{max-width:1100px;margin:auto;padding:30px}a{color:#c3a6ff}input,select,button,textarea{font:inherit;background:#171128;color:white;border:1px solid #655379;border-radius:9px;padding:10px;margin:4px}button{cursor:pointer}article{background:#151127;border:1px solid #ffffff29;border-radius:16px;padding:20px;margin:15px 0}small{color:#c8c0e5}pre{white-space:pre-wrap;overflow-wrap:anywhere}.profile-edit{background:#151127;border:1px solid #655379;border-radius:16px;padding:20px;margin:20px 0}.profile-edit label{display:block;margin:12px 0}.profile-edit label input,.profile-edit textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0}.edit-link{display:flex;flex-wrap:wrap;gap:8px}.edit-link input{flex:1;min-width:150px}.actions{display:flex;flex-wrap:wrap}.tabs{display:flex;gap:8px;border-bottom:1px solid #655379;padding-bottom:12px;margin:24px 0}.tabs [aria-selected="true"]{background:#8654d4;border-color:#c3a6ff}.tabs button:focus-visible{outline:2px solid #d9c4ff;outline-offset:3px}[hidden]{display:none!important}#status{min-height:24px;color:#e6c8ff}</style>
<main><a href="/">✦ SolarLink</a><h1>Staff administration</h1><p>Search by username, display name or Discord ID. Every change requires a reason and is recorded.</p><div class="tabs" role="tablist" aria-label="Staff sections"><button id="usersTab" role="tab" aria-selected="true" aria-controls="usersPanel" tabindex="0">Users</button><button id="auditTab" role="tab" aria-selected="false" aria-controls="auditPanel" tabindex="-1">Audit Log</button></div><p id="status" role="status"></p><section id="usersPanel" role="tabpanel" aria-labelledby="usersTab"><form id="search"><input id="query" maxlength="100" aria-label="Search users" placeholder="Search users"><button>Search</button></form><section id="profileEditor" class="profile-edit" hidden aria-labelledby="editTitle"><h2 id="editTitle" tabindex="-1">Edit profile</h2><p>Update public details and links. A reason is required. Discord identity, roles and suspension use separate controls.</p><form id="profileEdit"><label>Username<input id="editUsername" required maxlength="30" pattern="[a-z0-9_-]{3,30}"></label><label>Display name<input id="editName" maxlength="60"></label><label>Bio<textarea id="editBio" maxlength="240"></textarea></label><label>Profile picture URL<input id="editPicture" type="url" maxlength="2048"></label><label>Banner URL<input id="editBanner" type="url" maxlength="2048"></label><label>Background URL<input id="editBackground" type="url" maxlength="2048"></label><label>Accent color<input id="editColor" type="color"></label><h3>Links</h3><div id="editLinks"></div><button id="addEditLink" type="button">Add link</button><label>Reason for editing<input id="editReason" required maxlength="500"></label><button id="saveEdit" type="submit">Save profile</button><button id="reloadEdit" type="button">Reload profile</button><button id="cancelEdit" type="button">Cancel</button><p id="editStatus" role="status"></p></form></section><div id="users"></div><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></section><section id="auditPanel" role="tabpanel" aria-labelledby="auditTab" hidden><h2>Recent staff actions</h2><button id="refresh">Refresh audit history</button><div id="audit"></div></section></main>
<script>
const $=id=>document.getElementById(id);let page=1,role,actorId;
async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function load(){try{const data=await api('/api/staff/users?q='+encodeURIComponent($('query').value)+'&page='+page);role=data.role;actorId=data.actorId;$('users').replaceChildren();for(const u of data.users){const card=el('article','');const heading=el('h2','');const identity=el('p','');if(u.username){const url='/'+encodeURIComponent(u.username);const nameLink=el('a',u.display_name||u.discord_username);nameLink.href=url;const usernameLink=el('a','@'+u.username);usernameLink.href=url;heading.append(nameLink);identity.append(usernameLink)}else{heading.textContent=u.display_name||u.discord_username;identity.append(el('span','No public profile'))}identity.append(el('span',` · Discord ${u.discord_id} · ${u.role} · ${u.suspended?'Suspended':'Active'}`));card.append(heading,identity);
if(String(u.id)!==String(actorId)&&(role==='admin'||u.role==='user')){const actions=el('div','');actions.className='actions';const reason=el('input','');reason.placeholder='Reason (required)';reason.maxLength=500;reason.setAttribute('aria-label','Moderation reason for '+u.discord_username);const toggle=el('button',u.suspended?'Restore':'Suspend');toggle.onclick=()=>change(u.id,u.suspended?'restore':'suspend',null,reason.value);const edit=el('button','Edit profile');edit.onclick=()=>openProfileEditor(u.id);actions.append(reason,toggle,edit);if(role==='admin'){const select=el('select','');select.setAttribute('aria-label','Role for '+u.discord_username);for(const r of ['user','staff','admin']){const option=el('option',r);option.value=r;select.append(option)}select.value=u.role;const save=el('button','Assign role');save.onclick=()=>change(u.id,'role',select.value,reason.value);actions.append(select,save)}card.append(actions)}$('users').append(card)}$('page').textContent=' Page '+page+' ';$('previous').disabled=page===1;$('next').disabled=!data.hasMore}catch(e){$('status').textContent=e.message;$('users').replaceChildren()}}
async function change(id,action,value,reason){if(!reason.trim()){$('status').textContent='Enter a reason first.';return}if(!confirm(`Apply ${action}${value?' → '+value:''} to this account?`))return;try{await api('/api/staff/users/'+id+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value,reason})});$('status').textContent='Change saved.';await load();await audit()}catch(e){$('status').textContent=e.message}}
async function audit(){try{const data=await api('/api/staff/audit');$('audit').replaceChildren();for(const a of data.actions){$('audit').append(el('pre',`${a.created_at} · Actor #${a.actor_id} → User #${a.target_id}: ${a.action} (${a.old_value} → ${a.new_value})\n${a.reason}`))}}catch(e){$('status').textContent=e.message}}

let editingId=null,editingVersion=null;
function addEditLink(label='',url=''){
 const row=el('div','');row.className='edit-link';const title=el('input','');title.value=label;title.maxLength=80;title.required=true;title.placeholder='Link title';title.setAttribute('aria-label','Link title');title.dataset.field='label';
 const address=el('input','');address.value=url;address.type='url';address.required=true;address.maxLength=2048;address.placeholder='https://example.com';address.setAttribute('aria-label','Link URL');address.dataset.field='url';
 const remove=el('button','Remove link');remove.type='button';remove.onclick=()=>row.remove();row.append(title,address,remove);$('editLinks').append(row);
}
async function openProfileEditor(id){
 try{const data=await api('/api/staff/users/'+id+'/profile');const p=data.profile;editingId=id;editingVersion=data.version;
 for(const [field,key] of Object.entries({editUsername:'username',editName:'name',editBio:'bio',editPicture:'profile_image',editBanner:'banner_image',editBackground:'background_image',editColor:'accent_color'}))$(field).value=p[key]|| (key==='accent_color'?'#a36aff':'');
 $('editLinks').replaceChildren();p.links.forEach(l=>addEditLink(l.label,l.url));$('editReason').value='';$('editStatus').textContent='';$('profileEditor').hidden=false;$('editTitle').textContent='Edit profile · '+(p.username||'User #'+id);$('editTitle').focus();
 }catch(e){$('status').textContent=e.message}
}
$('addEditLink').onclick=()=>{if($('editLinks').children.length>=30){$('editStatus').textContent='Maximum 30 links.';return}addEditLink()};
$('cancelEdit').onclick=()=>{$('profileEditor').hidden=true;editingId=null;editingVersion=null};
$('reloadEdit').onclick=()=>{if(editingId&&confirm('Reload and discard unsaved changes?'))openProfileEditor(editingId)};
$('profileEdit').onsubmit=async e=>{e.preventDefault();if(!editingId)return;
 const profile={username:$('editUsername').value.trim().toLowerCase(),name:$('editName').value,bio:$('editBio').value,profile_image:$('editPicture').value.trim(),banner_image:$('editBanner').value.trim(),background_image:$('editBackground').value.trim(),accent_color:$('editColor').value,links:[...$('editLinks').children].map(row=>({label:row.querySelector('[data-field="label"]').value,url:row.querySelector('[data-field="url"]').value}))};
 const reason=$('editReason').value.trim();if(!reason){$('editStatus').textContent='Enter a reason.';return}if(!confirm('Save changes to this user’s public profile?'))return;
 for(const id of ['saveEdit','cancelEdit','reloadEdit'])$(id).disabled=true;
 try{await api('/api/staff/users/'+editingId+'/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile,reason,version:editingVersion})});$('profileEditor').hidden=true;editingId=null;editingVersion=null;$('status').textContent='Profile updated and recorded in the audit log.';await load();await audit()}catch(err){$('editStatus').textContent=err.message}finally{for(const id of ['saveEdit','cancelEdit','reloadEdit'])$(id).disabled=false}
};

function selectTab(name){for(const section of ['users','audit']){const active=section===name;$(section+'Tab').setAttribute('aria-selected',String(active));$(section+'Tab').tabIndex=active?0:-1;$(section+'Panel').hidden=!active}if(name==='audit')audit()}
for(const name of ['users','audit']){$(name+'Tab').onclick=()=>selectTab(name);$(name+'Tab').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?'users':e.key==='End'?'audit':name==='users'?'audit':'users';selectTab(next);$(next+'Tab').focus()}}
$('search').onsubmit=e=>{e.preventDefault();page=1;load()};$('previous').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('refresh').onclick=audit;load();
</script></html>
