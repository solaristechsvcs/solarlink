<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarLink · Staff</title>
<style>body{font:16px system-ui;color:#f6f3ff;background:radial-gradient(ellipse at top,#342063,#070615);margin:0;min-height:100vh}main{max-width:1100px;margin:auto;padding:30px}a{color:#c3a6ff}input,select,button{font:inherit;background:#171128;color:white;border:1px solid #655379;border-radius:9px;padding:10px;margin:4px}button{cursor:pointer}article{background:#151127;border:1px solid #ffffff29;border-radius:16px;padding:20px;margin:15px 0}small{color:#c8c0e5}pre{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap}#status{min-height:24px;color:#e6c8ff}</style>
<main><a href="/">✦ SolarLink</a><h1>Staff administration</h1><p>Search by username, display name or Discord ID. Every change requires a reason and is recorded.</p><form id="search"><input id="query" maxlength="100" aria-label="Search users" placeholder="Search users"><button>Search</button></form><p id="status" role="status"></p><div id="users"></div><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button><h2>Recent staff actions</h2><button id="refresh">Refresh audit history</button><div id="audit"></div></main>
<script>
const $=id=>document.getElementById(id);let page=1,role,actorId;
async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function load(){try{const data=await api('/api/staff/users?q='+encodeURIComponent($('query').value)+'&page='+page);role=data.role;actorId=data.actorId;$('users').replaceChildren();for(const u of data.users){const card=el('article','');card.append(el('h2',u.display_name||u.discord_username),el('p',`@${u.username||'(no profile)'} · Discord ${u.discord_id} · ${u.role} · ${u.suspended?'Suspended':'Active'}`));
if(String(u.id)!==String(actorId)&&(role==='admin'||u.role==='user')){const actions=el('div','');actions.className='actions';const reason=el('input','');reason.placeholder='Reason (required)';reason.maxLength=500;reason.setAttribute('aria-label','Moderation reason for '+u.discord_username);const toggle=el('button',u.suspended?'Restore':'Suspend');toggle.onclick=()=>change(u.id,u.suspended?'restore':'suspend',null,reason.value);actions.append(reason,toggle);if(role==='admin'){const select=el('select','');select.setAttribute('aria-label','Role for '+u.discord_username);for(const r of ['user','staff','admin']){const option=el('option',r);option.value=r;select.append(option)}select.value=u.role;const save=el('button','Assign role');save.onclick=()=>change(u.id,'role',select.value,reason.value);actions.append(select,save)}card.append(actions)}$('users').append(card)}$('page').textContent=' Page '+page+' ';$('previous').disabled=page===1;$('next').disabled=!data.hasMore}catch(e){$('status').textContent=e.message;$('users').replaceChildren()}}
async function change(id,action,value,reason){if(!reason.trim()){$('status').textContent='Enter a reason first.';return}if(!confirm(`Apply ${action}${value?' → '+value:''} to this account?`))return;try{await api('/api/staff/users/'+id+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value,reason})});$('status').textContent='Change saved.';await load();await audit()}catch(e){$('status').textContent=e.message}}
async function audit(){try{const data=await api('/api/staff/audit');$('audit').replaceChildren();for(const a of data.actions){$('audit').append(el('pre',`${a.created_at} · Actor #${a.actor_id} → User #${a.target_id}: ${a.action} (${a.old_value} → ${a.new_value})\n${a.reason}`))}}catch(e){$('status').textContent=e.message}}
$('search').onsubmit=e=>{e.preventDefault();page=1;load()};$('previous').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('refresh').onclick=audit;load();audit();
</script></html>
