<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarLink · Staff</title>
<style>body{font:16px system-ui;color:#f6f3ff;background:radial-gradient(ellipse at top,#342063,#070615);margin:0;min-height:100vh}main{max-width:1100px;margin:auto;padding:30px}a{color:#c3a6ff}input,select,button{font:inherit;background:#171128;color:white;border:1px solid #655379;border-radius:9px;padding:10px;margin:4px}button{cursor:pointer}article{background:#151127;border:1px solid #ffffff29;border-radius:16px;padding:20px;margin:15px 0}small{color:#c8c0e5}pre{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap}.tabs{display:flex;gap:8px;border-bottom:1px solid #655379;padding-bottom:12px;margin:24px 0}.tabs [aria-selected="true"]{background:#8654d4;border-color:#c3a6ff}.tabs button:focus-visible{outline:2px solid #d9c4ff;outline-offset:3px}[hidden]{display:none!important}#status{min-height:24px;color:#e6c8ff}</style>
<main><a href="/">✦ SolarLink</a><h1>Staff administration</h1><p>Search by username, display name or Discord ID. Every change requires a reason and is recorded.</p><div class="tabs" role="tablist" aria-label="Staff sections"><button id="usersTab" role="tab" aria-selected="true" aria-controls="usersPanel" tabindex="0">Users</button><button id="auditTab" role="tab" aria-selected="false" aria-controls="auditPanel" tabindex="-1">Audit Log</button></div><p id="status" role="status"></p><section id="usersPanel" role="tabpanel" aria-labelledby="usersTab"><form id="search"><input id="query" maxlength="100" aria-label="Search users" placeholder="Search users"><button>Search</button></form><div id="users"></div><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></section><section id="auditPanel" role="tabpanel" aria-labelledby="auditTab" hidden><h2>Recent staff actions</h2><button id="refresh">Refresh audit history</button><div id="audit"></div></section></main>
<script>
const $=id=>document.getElementById(id);let page=1,role,actorId;
async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function load(){try{const data=await api('/api/staff/users?q='+encodeURIComponent($('query').value)+'&page='+page);role=data.role;actorId=data.actorId;$('users').replaceChildren();for(const u of data.users){const card=el('article','');const heading=el('h2','');const identity=el('p','');if(u.username){const url='/'+encodeURIComponent(u.username);const nameLink=el('a',u.display_name||u.discord_username);nameLink.href=url;const usernameLink=el('a','@'+u.username);usernameLink.href=url;heading.append(nameLink);identity.append(usernameLink)}else{heading.textContent=u.display_name||u.discord_username;identity.append(el('span','No public profile'))}identity.append(el('span',` · Discord ${u.discord_id} · ${u.role} · ${u.suspended?'Suspended':'Active'}`));card.append(heading,identity);
if(String(u.id)!==String(actorId)&&(role==='admin'||u.role==='user')){const actions=el('div','');actions.className='actions';const reason=el('input','');reason.placeholder='Reason (required)';reason.maxLength=500;reason.setAttribute('aria-label','Moderation reason for '+u.discord_username);const toggle=el('button',u.suspended?'Restore':'Suspend');toggle.onclick=()=>change(u.id,u.suspended?'restore':'suspend',null,reason.value);actions.append(reason,toggle);if(role==='admin'){const select=el('select','');select.setAttribute('aria-label','Role for '+u.discord_username);for(const r of ['user','staff','admin']){const option=el('option',r);option.value=r;select.append(option)}select.value=u.role;const save=el('button','Assign role');save.onclick=()=>change(u.id,'role',select.value,reason.value);actions.append(select,save)}card.append(actions)}$('users').append(card)}$('page').textContent=' Page '+page+' ';$('previous').disabled=page===1;$('next').disabled=!data.hasMore}catch(e){$('status').textContent=e.message;$('users').replaceChildren()}}
async function change(id,action,value,reason){if(!reason.trim()){$('status').textContent='Enter a reason first.';return}if(!confirm(`Apply ${action}${value?' → '+value:''} to this account?`))return;try{await api('/api/staff/users/'+id+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value,reason})});$('status').textContent='Change saved.';await load();await audit()}catch(e){$('status').textContent=e.message}}
async function audit(){try{const data=await api('/api/staff/audit');$('audit').replaceChildren();for(const a of data.actions){$('audit').append(el('pre',`${a.created_at} · Actor #${a.actor_id} → User #${a.target_id}: ${a.action} (${a.old_value} → ${a.new_value})\n${a.reason}`))}}catch(e){$('status').textContent=e.message}}
function selectTab(name){for(const section of ['users','audit']){const active=section===name;$(section+'Tab').setAttribute('aria-selected',String(active));$(section+'Tab').tabIndex=active?0:-1;$(section+'Panel').hidden=!active}if(name==='audit')audit()}
for(const name of ['users','audit']){$(name+'Tab').onclick=()=>selectTab(name);$(name+'Tab').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?'users':e.key==='End'?'audit':name==='users'?'audit':'users';selectTab(next);$(next+'Tab').focus()}}
$('search').onsubmit=e=>{e.preventDefault();page=1;load()};$('previous').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('refresh').onclick=audit;load();
</script></html>
